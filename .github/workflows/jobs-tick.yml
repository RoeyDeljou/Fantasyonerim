# Wakes the API (Render free tier sleeps after 15 min) and runs every due job: content ingestion
# (podcast / Instagram / X), FPL deadline reminders, gameweek summaries, cleanup.
# Jobs are idempotent and lease-guarded, so an extra or delayed tick is harmless.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   API_URL      e.g. https://fantasyonerim-api.onrender.com
#   CRON_SECRET  same value as the API's CRON_SECRET env var
name: Jobs tick

on:
  schedule:
    - cron: '*/5 * * * *' # GitHub may delay scheduled runs by several minutes under load
  workflow_dispatch:

concurrency:
  group: jobs-tick
  cancel-in-progress: false

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /internal/jobs/tick
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL / CRON_SECRET secrets not set yet — skipping."; exit 0
          fi
          BASE="${API_URL%/}" # tolerate a trailing slash in the secret
          # A sleeping free-tier service can take ~60 s to wake: allow it.
          curl --fail-with-body --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            -X POST "$BASE/internal/jobs/tick" -H "x-cron-secret: $CRON_SECRET"
