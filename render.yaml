# Fantasyonerim API on Render (Blueprint). The web app is a static export hosted on Vercel (vercel.json).
# Full walkthrough: docs/DEPLOY.md.
#
# * plan: the free plan sleeps after 15 min idle (~50 s cold start on the next request) and its in-process
#   scheduler stops while asleep. The GitHub Actions workflow .github/workflows/jobs-tick.yml calls
#   /internal/jobs/tick every 5 min, which wakes it and keeps content ingestion + deadline reminders running,
#   but the first app open after a quiet period is still slow. `starter` (always on) is recommended for launch.
# * Database: Neon free tier (persistent, never auto-deleted), region Europe/Frankfurt — NOT Render's free
#   Postgres, which is deleted after 30 days. Paste Neon's pooled connection string into DATABASE_URL.
# * Migrations run once per deploy at the end of the build, never on boot.
services:
  - type: web
    name: fantasyonerim-api
    runtime: node
    region: frankfurt # closest Render region to Israel; keep the database in the same region
    plan: free # see the note above — switch to `starter` for always-on
    healthCheckPath: /health
    buildCommand: >-
      npm ci --include=dev &&
      npx tsc -b tsconfig.build.json &&
      npm run prisma:deploy -w @fant/api
    startCommand: npm run start -w @fant/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: TRUST_PROXY
        value: 'true'
      - key: FPL_MODE
        value: live
      - key: FPL_USER_AGENT
        value: 'Fantasyonerim/1.0 (+https://linktr.ee/Fantasyonerim)'
      - key: JOBS_ENABLED
        value: 'true'
      - key: MEDIA_STORE
        value: s3
      # Generated once by Render (256-bit, base64). SECRETS_KEY encrypts social tokens at rest — never rotate
      # it without re-entering the integration secrets in the admin console.
      - key: SECRETS_KEY
        generateValue: true
      # Copy this value into the GitHub repo secret CRON_SECRET (see docs/DEPLOY.md).
      - key: CRON_SECRET
        generateValue: true
      # ---- set by hand in the Render dashboard (docs/DEPLOY.md lists where each value comes from) ----
      - key: DATABASE_URL
        sync: false
      - key: API_PUBLIC_URL # e.g. https://fantasyonerim-api.onrender.com
        sync: false
      - key: WEB_APP_URL # e.g. https://fantasyonerim.vercel.app
        sync: false
      - key: CORS_ORIGINS # the web app origin(s), comma-separated; "*" is refused in production
        sync: false
      - key: ADMIN_BOOTSTRAP_USERNAME
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: VAPID_PUBLIC_KEY # `npm run vapid -w @fant/api` prints a pair
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT # mailto:ashalim.fantasy@gmail.com
        sync: false
      # Backblaze B2 (owner's choice): endpoint/region from the bucket page, e.g. s3.eu-central-003.backblazeb2.com
      - key: S3_ENDPOINT # https://s3.eu-central-003.backblazeb2.com
        sync: false
      - key: S3_REGION # eu-central-003 (the middle part of the endpoint host)
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL # https://f003.backblazeb2.com/file/<bucket> (public bucket's friendly URL)
        sync: false
      # Spotify app credentials (owner-approved). Seeded encrypted into the Spotify integration on first boot so
      # nobody re-types them; ignored once an admin saves keys in the console. Never commit these values.
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: META_APP_ID # optional until Instagram is connected
        sync: false
      - key: META_APP_SECRET
        sync: false
